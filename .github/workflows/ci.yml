name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npx tsc --noEmit

      # Proves the app is configured to deploy, not just that it compiles.
      - run: npm run verify:deployment
        env:
          DATABASE_URL: file:./data/ci.db

      # Restore Next.js's build cache so the added production build stays cheap.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # A production build is a required release check. Routes are force-dynamic,
      # so the build compiles without reaching the database.
      - run: npm run build
        env:
          DATABASE_URL: file:./data/ci.db

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
